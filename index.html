<!doctype html>
<html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa em Ordem</title>
<!--
  Casa em Ordem — versão local.
  Este arquivo contém SÓ o código. Os dados ficam num arquivo separado
  (ex.: Sistema Casa Claude\CasaDados\casa-dados.json), escolhido na primeira vez
  que a página é aberta. Nunca são enviados a nenhum servidor pela página.
-->
</head><body>
<style>
  /* Layout: abas no topo, conteúdo em cartões e listas agrupadas por categoria ou cômodo.
     Paleta: verde-musgo (ação), âmbar (rótulos e prioridade média), terracota (alerta). */
  :root {
    --bg: #f6f5ef;
    --surface: #ffffff;
    --surface-2: #f0efe6;
    --border: #e3e0d3;
    --text: #292a22;
    --text-muted: #74755f;
    --accent: #3f6b4f;
    --accent-hover: #345a41;
    --accent-soft: #e7efe8;
    --accent-2: #a8672a;
    --accent-2-soft: #f5e8d8;
    --danger: #b3492f;
    --danger-soft: #f7e4de;
    --focus: #3f6b4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d17;
      --surface: #24261e;
      --surface-2: #2c2e24;
      --border: #3c3e32;
      --text: #ede9dd;
      --text-muted: #a5a691;
      --accent: #74b78b;
      --accent-hover: #86c69c;
      --accent-soft: #2b3a2f;
      --accent-2: #dc9a58;
      --accent-2-soft: #3a2f20;
      --danger: #e58567;
      --danger-soft: #43271f;
      --focus: #74b78b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d17;
    --surface: #24261e;
    --surface-2: #2c2e24;
    --border: #3c3e32;
    --text: #ede9dd;
    --text-muted: #a5a691;
    --accent: #74b78b;
    --accent-hover: #86c69c;
    --accent-soft: #2b3a2f;
    --accent-2: #dc9a58;
    --accent-2-soft: #3a2f20;
    --danger: #e58567;
    --danger-soft: #43271f;
    --focus: #74b78b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  #app-root {
    max-width: 1080px;
    margin: 0 auto;
    padding-block: 20px 72px;
    padding-inline: 20px;
  }
  a { color: var(--accent); }
  /* Tab navigation */
  #tabs-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  #tabs-nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font: inherit;
    font-weight: 600;
    padding: 12px 10px;
    margin-bottom: -1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px 4px 0 0;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .tab-btn.soon { color: var(--text-muted); opacity: 0.7; }
  .soon-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-2);
    background: var(--accent-2-soft);
    padding: 2px 6px;
    border-radius: 999px;
  }
  #save-status {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 0;
  }
  #save-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
  }
  #save-status.saved .dot { background: var(--accent); }
  #save-status.saving .dot { background: var(--accent-2); }
  #save-status.error .dot { background: var(--danger); }
  #content { margin-top: 4px; }
  .section-hint {
    color: var(--text-muted);
    font-size: 13px;
    margin: 14px 0 0;
  }
  .empty-state {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 18px;
    padding: 24px;
    text-align: center;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  /* Buttons & inputs shared */
  input[type="text"], select, textarea {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
  }
  input[type="text"]:focus, select:focus, textarea:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    font: inherit;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn-text {
    background: none;
    border: none;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    color: var(--accent-2);
    cursor: pointer;
    padding: 4px 2px;
  }
  .btn-text:hover { text-decoration: underline; }
  .btn-text:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn-text.danger { color: var(--danger); }
  /* Cardapio */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .day-card > h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-2);
  }
  .meal-row { display: flex; flex-direction: column; gap: 4px; }
  .meal-row label { font-size: 12px; color: var(--text-muted); }
  .meal-input-row { display: flex; gap: 6px; align-items: center; }
  .meal-input-row input[type="text"] { flex: 1; min-width: 0; }
  .btn-add-compra {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 9px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-add-compra:hover { background: var(--accent-soft); }
  .btn-add-compra:disabled { opacity: 0.6; cursor: default; }
  /* Alternador Mercado | Casa */
  .seg-toggle {
    display: inline-flex;
    gap: 2px;
    margin-top: 16px;
    padding: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .seg-btn {
    background: none;
    border: none;
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-muted);
    padding: 7px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  .seg-btn:hover { color: var(--text); }
  .seg-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .seg-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }
  /* Listas (Compras, Casa, Tarefas) */
  .compras-form {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .compras-form input[type="text"] { flex: 1; min-width: 180px; }
  .compras-form input.input-preco { flex: 0 0 120px; min-width: 100px; width: 120px; }
  .compras-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .categoria-group { margin-top: 18px; }
  .categoria-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 8px;
  }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .item-row input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .item-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item-row.done .item-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .item-row.done .badge, .item-row.done .item-preco { opacity: 0.55; }
  .item-preco {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .item-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
  }
  .item-remove:hover { color: var(--danger); }
  .item-remove:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* Prioridade */
  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.prio-alta { color: var(--danger); background: var(--danger-soft); }
  .badge.prio-media { color: var(--accent-2); background: var(--accent-2-soft); }
  .badge.prio-baixa { color: var(--accent); background: var(--accent-soft); }
  /* Totais da lista Casa */
  .totais {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .total-tile {
    flex: 1;
    min-width: 160px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .total-label { font-size: 12px; color: var(--text-muted); }
  .total-valor {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .total-tile.destaque .total-valor { color: var(--accent); }
  .total-sub { font-size: 12px; color: var(--text-muted); }
  /* Painéis de formulário */
  .receitas-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .receita-form, .form-panel {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 12px;
  }
  .receita-form > .field-label:first-child,
  .form-panel > .field-label:first-child { margin-top: 0; }
  .form-selects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 4px;
  }
  .form-selects > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .form-selects .field-label { margin-top: 8px; }
  .form-selects select { width: 100%; }
  .ingredientes-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }
  .ingrediente-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 7px 10px;
  }
  .ingrediente-text { flex: 1; font-size: 14px; }
  .modo-preparo {
    min-height: 130px;
    resize: vertical;
    margin-top: 6px;
  }
  .obs-input { min-height: 80px; resize: vertical; margin-top: 6px; }
  .form-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
  }
  /* Receitas */
  .receitas-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .receita-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .receita-card h3 { margin: 0; font-size: 16px; cursor: pointer; }
  .receita-card h3:hover { color: var(--accent); }
  .receita-meta { font-size: 12px; color: var(--text-muted); }
  .receita-preview {
    font-size: 13px;
    color: var(--text-muted);
    margin: 4px 0 0;
    white-space: pre-line;
  }
  .receita-actions, .card-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: auto;
    padding-top: 10px;
  }
  .receita-view {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 640px;
  }
  .receita-view-back {
    align-self: flex-start;
    margin-bottom: 6px;
  }
  .receita-view-title { margin: 0; font-size: 21px; }
  .receita-view-ingredientes {
    margin: 6px 0 0;
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 14px;
  }
  .receita-view-modo {
    margin: 4px 0 0;
    white-space: pre-line;
    font-size: 14px;
    line-height: 1.6;
  }
  /* Reparos */
  .reparos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .reparo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .reparo-titulo { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .reparo-card.feito .reparo-titulo { text-decoration: line-through; color: var(--text-muted); }
  .reparo-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .dica-texto {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
    margin: 2px 0 0;
    overflow-wrap: anywhere;
  }
  .dica-fonte { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }
  .dica-fonte a { color: var(--accent); }
  .dicas-busca { width: 100%; margin-top: 14px; }
  a.receita-video { display: inline-block; text-decoration: none; margin-top: 10px; }
  .import-panel { margin-top: 14px; }
  .ex-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ex-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .ex-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .ex-num { font-weight: 700; color: var(--accent); }
  .ex-nome { font-weight: 600; overflow-wrap: anywhere; }
  .ex-dose { font-size: 13px; color: var(--text-muted); }
  .ex-como { font-size: 13px; margin: 6px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .ex-form-row { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 8px; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .ex-form-row .ex-form-nome, .ex-form-row textarea, .ex-form-row .ex-form-link { grid-column: 1 / -1; }
  .ex-form-row textarea { min-height: 50px; resize: vertical; }
  .ex-form-row .item-remove { justify-self: end; grid-column: 1 / -1; }
  .ficha-aviso { font-size: 12px; color: var(--text-muted); margin: 10px 0 0; }
  .treino-painel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .treino-painel h3 { margin: 0; font-size: 15px; }
  .treino-perfil { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  .treino-perfil label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
  .treino-perfil input { width: 150px; }
  .meta-barra { height: 10px; border-radius: 6px; background: var(--accent-soft); overflow: hidden; }
  .meta-barra span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  .treino-resumo { font-size: 14px; }
  .plano-semana { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .plano-semana b { display: inline-block; min-width: 70px; }
  .plano-semana button { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-align: left; }
  .dias-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .online-barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; overflow-wrap: anywhere; }
  .setup-panel .login-email { flex: 1 1 220px; min-width: 0; }
  .import-msg { margin-top: 12px; }
  .header-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .import-panel ul { margin: 8px 0 0; padding-left: 20px; font-size: 13px; max-height: 220px; overflow: auto; }
  .import-panel .import-dup { color: var(--text-muted); }
  .reparo-obs {
    font-size: 13px;
    color: var(--text-muted);
    white-space: pre-line;
    margin: 2px 0 0;
    overflow-wrap: anywhere;
  }
  .card-actions select { padding: 6px 8px; font-size: 13px; }
  /* Tarefas: filtro por cômodo */
  .room-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--surface); color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 12px;
  }
  .chip:hover { color: var(--text); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .chip-count { font-weight: 500; opacity: 0.8; margin-left: 4px; }
  .room-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .room-head .categoria-title { margin-bottom: 0; }
  .room-actions { display: flex; gap: 14px; }
  .room-empty { color: var(--text-muted); font-size: 13px; margin: 0; padding: 4px 2px; }
  .freq-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-muted); background: var(--surface-2); padding: 3px 8px;
    border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .item-row.done .freq-badge { opacity: 0.55; }
  .coming-soon .empty-state { margin-top: 14px; }
  /* Backup */
  .tab-btn .alert-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); }
  .backup-wrap { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; max-width: 720px; }
  .backup-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .backup-card h3 { margin: 0; font-size: 16px; }
  .backup-card p { margin: 0; font-size: 14px; color: var(--text-muted); }
  .backup-last { font-size: 14px; }
  .backup-last strong { font-variant-numeric: tabular-nums; }
  .backup-last.atrasado strong { color: var(--accent-2); }
  .backup-resumo { display: flex; flex-wrap: wrap; gap: 6px; }
  .backup-resumo span {
    font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--surface-2);
    padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .backup-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn-secondary {
    background: var(--surface); color: var(--accent); border: 1px solid var(--accent);

    actions.appendChild(sendBtn);
    actions.appendChild(delBtn);
    wrap.appendChild(actions);
    container.appendChild(wrap);
  }
  function renderReceitas(container) {
    var viewingRecipe = receitaViewId ? findById(state.receitas, receitaViewId) : null;
    if (receitaViewId && !viewingRecipe) receitaViewId = null;
    if (viewingRecipe) {
      renderReceitaDetail(container, viewingRecipe);
      return;
    }
    var header = el("div", { class: "receitas-header" });
    header.appendChild(el("p", { class: "section-hint", text: "Guarde suas receitas com ingredientes e modo de preparo." }));
    if (!receitaForm) {
      var acoes = el("div", { class: "header-actions" });
      var impBtn = el("button", { class: "btn-text", type: "button", text: "Importar receitas" });
      impBtn.addEventListener("click", escolherArquivoImportacao);
      var newBtn = el("button", { class: "btn-primary", type: "button", text: "+ Nova receita" });
      newBtn.addEventListener("click", function () {
        var catAtual = RECEITA_CATEGORIAS.indexOf(state.receitasFiltro) >= 0 ? state.receitasFiltro : "";
        receitaForm = { editingId: null, nome: "", ingredientes: [], ingredienteDraft: "", modoPreparo: "", link: "", fonte: "", categoria: catAtual };
        renderContent();
      });
      acoes.appendChild(impBtn);
      acoes.appendChild(newBtn);
      header.appendChild(acoes);
    }
    container.appendChild(header);
    renderImportacao(container);
    if (receitaForm) container.appendChild(renderReceitaForm());
    if (state.receitas.length === 0 && !receitaForm) {
      container.appendChild(el("p", { class: "empty-state", text: "Nenhuma receita ainda. Adicione a primeira!" }));
      return;
    }
    if (state.receitas.length === 0) return;
    var filtro = state.receitasFiltro;
    function catDe(r) { return RECEITA_CATEGORIAS.indexOf(r.categoria) >= 0 ? r.categoria : ""; }
    var chips = el("div", { class: "room-chips", role: "group", "aria-label": "Filtrar receitas por categoria" });
    function addChip(key, label, count) {
      var active = filtro === key;
      var chip = el("button", { class: "chip" + (active ? " active" : ""), type: "button", "aria-pressed": active ? "true" : "false" }, [
        label, el("span", { class: "chip-count", text: String(count) })
      ]);
      chip.addEventListener("click", function () { state.receitasFiltro = key; schedulePersist(); renderContent(); });
      chips.appendChild(chip);
    }
    addChip("todas", "Todas", state.receitas.length);
    RECEITA_CATEGORIAS.forEach(function (c) {
      addChip(c, c, state.receitas.filter(function (r) { return catDe(r) === c; }).length);
    });
    var semCat = state.receitas.filter(function (r) { return !catDe(r); }).length;
    if (semCat > 0 || filtro === "") addChip("", "Sem categoria", semCat);
    container.appendChild(chips);
    var grupos = filtro === "todas" ? RECEITA_CATEGORIAS.concat([""]) : [filtro];
    var algum = false;
    grupos.forEach(function (c) {
      var itens = state.receitas.filter(function (r) { return catDe(r) === c; });
      if (!itens.length) return;
      algum = true;
      itens.sort(function (a, b) { return semAcento(a.nome).localeCompare(semAcento(b.nome)); });
      var group = el("div", { class: "categoria-group" });
      if (filtro === "todas") group.appendChild(el("div", { class: "categoria-title", text: (c || "Sem categoria") + " (" + itens.length + ")" }));
      var list = el("div", { class: "receitas-list" });
      itens.forEach(function (r) { list.appendChild(renderReceitaCard(r)); });
      group.appendChild(list);
      container.appendChild(group);
    });
    if (!algum) container.appendChild(el("p", { class: "empty-state", text: "Nenhuma receita nesta categoria ainda." }));
  }
  function renderComingSoon(container, label) {
    container.appendChild(el("div", { class: "coming-soon" }, [
      el("p", { class: "empty-state", text: label + " ainda não foi construído. Em breve!" })
    ]));
  }
  // ----- render: dispatch -----
  function renderContent() {
    var content = document.getElementById("content");
    content.innerHTML = "";
    renderSetup(content);
    if (ONLINE && online.status !== "pronto") return;
    if (ONLINE && !abaVisivel(activeTab)) return;
    renderAba(content);
    if (ONLINE && SECOES[activeTab] && !podeEditar(activeTab)) aplicarSomenteLeitura(content);
  }
  function renderAba(content) {
    if (activeTab === "cardapio") renderCardapio(content);
    else if (activeTab === "receitas") renderReceitas(content);
    else if (activeTab === "dicas") renderDicas(content);
    else if (activeTab === "compras") renderCompras(content);
    else if (activeTab === "tarefas") renderTarefas(content);
    else if (activeTab === "reparos") renderReparos(content);
    else if (activeTab === "exercicios") renderFichas(content);
    else if (activeTab === "saude") renderSaude(content);
    else if (activeTab === "backup") renderBackup(content);
    else {
      var tab = TABS.filter(function (t) { return t.key === activeTab; })[0];
      renderComingSoon(content, tab ? tab.label : "");
    }
  }
  function renderAll() {
    renderNav();
    renderContent();
  }
  // ----- modo online (Supabase) -----
  // Quando a página é aberta pela internet (https), os dados vêm do Supabase, com login.
  // Aberta como arquivo do computador, tudo continua como antes (arquivo de dados local).
  // A URL e a chave "publishable" são públicas por natureza; quem protege os dados são as
  // regras de acesso (RLS) do banco. Nunca coloque aqui a chave secret/service_role.
  var SUPABASE_URL = "https://jtzhpcunaxczoscsjgur.supabase.co";
  var SUPABASE_KEY = "sb_publishable_2aLgJ-vF7gUq2BtgyrJrvg__6EmGx6C";
  var SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js";
  var UI_KEY = "casa-em-ordem-ui-v1";
  // Cada aba online vira um registro na tabela "secoes". O Financeiro nunca sobe.
  var SECOES = {
    cardapio: ["cardapio"], receitas: ["receitas"], dicas: ["dicas"], compras: ["compras", "casa"],
    tarefas: ["tarefas"], reparos: ["reparos"], exercicios: ["fichas", "treinoPerfil"], saude: ["medidas"]
  };
  var sb = null;
  var online = { status: "carregando", email: "", dono: false, acessos: {}, salvo: {}, msg: null, erroSalvar: false };
  var onlineChain = Promise.resolve();
  function podeVer(secao) { return online.dono || Object.prototype.hasOwnProperty.call(online.acessos, secao); }
  function podeEditar(secao) { return !ONLINE || online.dono || online.acessos[secao] === true; }
  function abaVisivel(key) {
    if (!ONLINE) return true;
    if (key === "financeiro") return false;
    if (key === "backup") return online.dono;
    return SECOES[key] ? podeVer(key) : false;
  }
  function secaoJSON(s) {
    var o = {};
    SECOES[s].forEach(function (k) { o[k] = state[k]; });
    return JSON.stringify(o);
  }
  function aplicarSecao(s, dados) {
    if (!dados || typeof dados !== "object") return;
    SECOES[s].forEach(function (k) { if (dados[k] !== undefined) state[k] = JSON.parse(JSON.stringify(dados[k])); });
  }
  function salvarUI() {
    try {
      var ui = {};
      UI_FIELDS.forEach(function (k) { ui[k] = state[k]; });
      localStorage.setItem(UI_KEY, JSON.stringify(ui));
    } catch (e) {}
  }
  function lerUI() {
    try { return JSON.parse(localStorage.getItem(UI_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function marcarSalvo() {
    Object.keys(SECOES).forEach(function (s) { online.salvo[s] = secaoJSON(s); });
  }
  function salvarOnline() {
    if (online.status !== "pronto") return;
    var mudou = Object.keys(SECOES).filter(function (s) { return podeEditar(s) && secaoJSON(s) !== online.salvo[s]; });
    if (!mudou.length) { setSaveStatus("online"); return; }
    onlineChain = onlineChain.then(function () {
      return Promise.all(mudou.map(function (s) {
        var j = secaoJSON(s);
        return sb.from("secoes").upsert({ secao: s, dados: JSON.parse(j) }).then(function (r) {
          if (r.error) throw r.error;
          online.salvo[s] = j;
        });
      }));
    }).then(function () {
      online.erroSalvar = false;
      setSaveStatus("online");
    }).catch(function () {
      online.erroSalvar = true;
      setSaveStatus("error");
    });
  }
  function editandoAgora() {
    var a = document.activeElement;
    return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && document.getElementById("content").contains(a));
  }
  // Traz do banco as abas que mudaram; não mexe numa aba com alteração local ainda não enviada.
  function receberSecao(s, dados) {
    if (!SECOES[s]) return false;
    if (secaoJSON(s) !== online.salvo[s]) return false;
    var antes = online.salvo[s];
    aplicarSecao(s, dados);
    state = normalizeState(state);
    online.salvo[s] = secaoJSON(s);
    return online.salvo[s] !== antes;
  }
  function recarregarOnline() {
    if (online.status !== "pronto") return;
    sb.from("secoes").select("secao,dados").then(function (r) {
      if (r.error || !r.data) return;
      var mudou = false;
      r.data.forEach(function (row) { if (receberSecao(row.secao, row.dados)) mudou = true; });
      if (mudou && !editandoAgora()) renderAll();
    });
  }
  function carregarOnline(session) {
    online.email = (session.user && session.user.email || "").toLowerCase();
    online.status = "carregando";
    renderAll();
    Promise.all([
      sb.from("donos").select("email"),
      sb.from("acessos").select("email,secao,pode_editar"),
      sb.from("secoes").select("secao,dados")
    ]).then(function (rs) {
      rs.forEach(function (r) { if (r.error) throw r.error; });
      online.dono = rs[0].data.some(function (d) { return String(d.email).toLowerCase() === online.email; });
      online.acessos = {};
      rs[1].data.forEach(function (a) {
        if (String(a.email).toLowerCase() === online.email) online.acessos[a.secao] = !!a.pode_editar;
      });
      if (!online.dono && !Object.keys(online.acessos).length) { online.status = "sem-acesso"; renderAll(); return; }
      var base = lerUI();
      state = normalizeState(base);
      rs[2].data.forEach(function (row) { if (SECOES[row.secao]) aplicarSecao(row.secao, row.dados); });
      state = normalizeState(state);
      marcarSalvo();
      if (!abaVisivel(state.activeTab)) {
        state.activeTab = TABS.filter(function (t) { return abaVisivel(t.key); })[0].key;
      }
      activeTab = state.activeTab;
      online.status = "pronto";
      setSaveStatus(online.dono || Object.keys(online.acessos).some(function (k) { return online.acessos[k]; }) ? "online" : "leitura");
      renderAll();
      sb.channel("secoes-mudancas")
        .on("postgres_changes", { event: "*", schema: "public", table: "secoes" }, function (p) {
          if (p.new && p.new.secao && receberSecao(p.new.secao, p.new.dados) && !editandoAgora()) renderAll();
        })
        .subscribe();
    }).catch(function () {
      online.status = "erro";
      online.msg = "Não foi possível carregar os dados. Verifique a internet e recarregue a página.";
      renderAll();
    });
  }
  function enviarLink(email, botao) {
    email = (email || "").trim().toLowerCase();
    online.digitado = email;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { online.msg = "Digite um e-mail válido."; renderAll(); return; }
    botao.disabled = true;
    botao.textContent = "Enviando…";
    sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } })
      .then(function (r) {
        if (r.error) {
          online.msg = /signup|not allowed|not found/i.test(r.error.message || "")
            ? "Este e-mail não tem acesso. Peça à dona do sistema para liberar."
            : /rate|seconds|many/i.test(r.error.message || "")
              ? "Muitos pedidos seguidos. Espere alguns minutos e tente de novo."
              : "Não foi possível enviar o link. Tente de novo em instantes.";
        } else {
          online.status = "link-enviado";
          online.email = email;
          online.msg = null;
        }
        renderAll();
      });
  }
  function sair() {
    sb.auth.signOut().then(function () {
      try { localStorage.removeItem(UI_KEY); } catch (e) {}
      location.reload();
    });
  }
  function renderOnlineSetup(container) {
    if (online.status === "pronto") {
      var barra = el("div", { class: "online-barra" });
      var papel = online.dono ? "" : (podeEditar(activeTab) ? "" : " · nesta aba você pode ver, mas não editar");
      barra.appendChild(el("span", { text: "Conectado como " + online.email + papel }));
      var s = el("button", { class: "btn-text", type: "button", text: "Sair" });
      s.addEventListener("click", sair);
      barra.appendChild(s);
      container.appendChild(barra);
      return;
    }
    var p = el("div", { class: "setup-panel" });
    if (online.status === "carregando") {
      p.appendChild(el("p", { text: "Carregando…" }));
    } else if (online.status === "login") {
      p.appendChild(el("h3", { text: "Entrar no Casa em Ordem" }));
      p.appendChild(el("p", { text: "Digite seu e-mail. Vamos enviar um link de acesso — é só abrir o e-mail neste aparelho e tocar no link. Não precisa de senha." }));
      var row = el("div", { class: "backup-row" });
      setSaveStatus("fora");
      var inp = el("input", { type: "text", inputmode: "email", class: "login-email", value: online.digitado || "", placeholder: "seu-email@exemplo.com", "aria-label": "Seu e-mail", autocomplete: "email" });
      var b = el("button", { class: "btn-primary", type: "button", text: "Receber link de acesso" });
      b.addEventListener("click", function () { enviarLink(inp.value, b); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") enviarLink(inp.value, b); });
      row.appendChild(inp);
      row.appendChild(b);
      p.appendChild(row);
    } else if (online.status === "link-enviado") {
      p.appendChild(el("h3", { text: "Confira seu e-mail" }));
      p.appendChild(el("p", { text: "Enviamos um link de acesso para " + online.email + ". Abra o e-mail neste aparelho e toque no link (veja também a caixa de spam)." }));
      var outro = el("button", { class: "btn-text", type: "button", text: "Usar outro e-mail" });
      outro.addEventListener("click", function () { online.status = "login"; renderAll(); });
      p.appendChild(outro);
    } else if (online.status === "sem-acesso") {
      p.appendChild(el("h3", { text: "Sem acesso ainda" }));
      p.appendChild(el("p", { text: "O e-mail " + online.email + " entrou, mas ainda não tem nenhuma aba liberada. Peça à dona do sistema para liberar." }));
      var s2 = el("button", { class: "btn-text", type: "button", text: "Sair" });
      s2.addEventListener("click", sair);
      p.appendChild(s2);
    } else {
      p.appendChild(el("h3", { text: "Algo deu errado" }));
    }
    if (online.msg) p.appendChild(el("p", { class: "backup-msg erro", text: online.msg }));
    container.appendChild(p);
  }
  // Em abas só de leitura, tira os botões de alterar e trava os campos.
  var BOTAO_EDITA = /^(\+|×|✓|Editar|Excluir|Confirmar|Importar|Salvar|Adicionar|Remover|Desmarcar|Desfazer|Enviar|Cancelar|Limpar|Marcar)/;
  function aplicarSomenteLeitura(content) {
    content.querySelectorAll("button").forEach(function (b) {
      if (b.closest(".online-barra")) return;
      if (BOTAO_EDITA.test(b.textContent.trim()) || b.classList.contains("danger") || b.classList.contains("btn-add-compra")) b.remove();
    });
    content.querySelectorAll("input, textarea, select").forEach(function (i) {
      if (i.classList.contains("dicas-busca")) return;
      i.disabled = true;
    });
  }
  function bootOnline() {
    setSaveStatus("carregando");
    renderAll();
    var s = document.createElement("script");
    s.src = SUPABASE_JS;
    s.onerror = function () {
      online.status = "erro";
      online.msg = "Não foi possível carregar o sistema. Verifique a internet e recarregue a página.";
      renderAll();
    };
    s.onload = function () {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var iniciado = false;
      sb.auth.onAuthStateChange(function (evento, session) {
        if (session && !iniciado) {
          iniciado = true;
          setTimeout(function () { carregarOnline(session); }, 0);
        } else if (!session && evento === "SIGNED_OUT") {
          iniciado = false;
        }
      });
      sb.auth.getSession().then(function (r) {
        if (!r.data.session && !iniciado) { online.status = "login"; renderAll(); }
      });
      document.addEventListener("visibilitychange", function () { if (!document.hidden) recarregarOnline(); });
    };
    document.head.appendChild(s);
  }
  // ----- boot -----
  if (ONLINE) {
    bootOnline();
    return;
  }
  // 1) mostra na hora a cópia guardada neste navegador (se houver)
  try {
    var local = localStorage.getItem(LS_KEY);
    if (local) {
      var parsedLocal = JSON.parse(local);
      if (extrairDados(parsedLocal)) {
        state = normalizeState(parsedLocal);
        activeTab = state.activeTab;
      }
    }
  } catch (e) {}
  setSaveStatus("local");
  renderAll();
  // 2) se já existe um arquivo de dados ligado, carrega dele (ele é a fonte oficial)
  if (FS_OK) {
    idbGet("dados").then(function (h) {
      if (!h) return;
      fileHandle = h;
      return h.queryPermission({ mode: "readwrite" }).then(function (p) {
        if (p === "granted") return conectar(h, true);
        fileStatus = "needs-permission";
        renderAll();
      });
    }).catch(function () {
      if (fileHandle && fileStatus !== "connected") { fileStatus = "needs-permission"; renderAll(); }
    });
  }
})();
</script></body></html>
